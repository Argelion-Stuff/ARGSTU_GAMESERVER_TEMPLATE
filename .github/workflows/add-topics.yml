name: Add Game Server Topics

on:
  push:
    branches:
      - main

jobs:
  add-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 Generate GitHub App Installation Token (GitHub official action)
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # ⚙️ Authenticate GH CLI with the GitHub App token
      - name: Configure GH CLI
        run: |
          echo "${{ steps.app_token.outputs.token }}" | gh auth login --with-token

      # 🏷️ Add Topics via GitHub API
      - name: Add repository topics
        id: add_topics
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "Adding topics: server, game"

          # Obtener topics actuales
          CURRENT_TOPICS=$(gh api /repos/$REPO/topics --jq '.names')

          # Combinar con los nuevos topics y asegurar array JSON válido
          NEW_TOPICS=$(jq -n --argjson cur "$CURRENT_TOPICS" '{"names": ($cur + ["server","game"] | unique)}')

          # PUT nuevos topics
          gh api \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/$REPO/topics \
            -f "$NEW_TOPICS"

      # 📊 Summary
      - name: Summary Report
        run: |
          {
            echo "### 🏷️ Topics Added Successfully"
            echo ""
            echo "**Repository:** \`$GITHUB_REPOSITORY\`"
            echo ""
            echo "The following topics were ensured to exist:"
            echo "- \`server\`"
            echo "- \`game\`"
            echo ""
            echo "🔐 Authentication method: GitHub App"
            echo "🎉 Initialization complete!"
          } >> $GITHUB_STEP_SUMMARY
