name: Add Game Server Topics

on:
  push:
    branches:
      - main

jobs:
  add-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 Generate GitHub App Installation Token (GitHub official action)
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # ⚙️ Authenticate GH CLI with the GitHub App token
      - name: Configure GH CLI
        run: |
          echo "${{ steps.app_token.outputs.token }}" | gh auth login --with-token

      # 🏷️ Add Topics via GitHub API
      - name: Add repository topics
        id: add_topics
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "Adding topics: server, game"

          # Obtener topics actuales
          CURRENT_TOPICS=$(gh api /repos/$REPO/topics --jq '.names')

          # Combinar con los nuevos topics y crear JSON
          JSON_PAYLOAD=$(jq -n --argjson cur "$CURRENT_TOPICS" '{"names": ($cur + ["server","game"] | unique)}')

          # Usar la API con input desde stdin
          echo "$JSON_PAYLOAD" | gh api \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/$REPO/topics \
            --input -

      - name: Add Branch Protection Rule
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          echo "Adding branch protection rule: ARGSTU Protection Branch"

          cat <<EOF | gh api -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            /repos/$REPO/rulesets \
            --input -
          {
            "name": "ARGSTU Protection Branch",
            "target": "branch",
            "source_type": "Repository",
            "source": "Argelion-Stuff/.github",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["~DEFAULT_BRANCH"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              { "type": "creation" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 1,
                  "dismiss_stale_reviews_on_push": true,
                  "required_reviewers": [],
                  "require_code_owner_review": true,
                  "require_last_push_approval": true,
                  "required_review_thread_resolution": true,
                  "automatic_copilot_code_review_enabled": true,
                  "allowed_merge_methods": ["merge","squash","rebase"]
                }
              }
            ],
            "bypass_actors": []
          }
          EOF

          echo "✅ Branch protection rule 'ARGSTU Protection Branch' added."

      - name: Summary Report
        run: |
          {
            echo "### 🏷️ Repository Initialization Summary"
            echo ""
            echo "**Repository:** \`$GITHUB_REPOSITORY\`"
            echo ""
            echo "The following topics were ensured to exist:"
            echo "- \`server\`"
            echo "- \`game\`"
            echo ""
            echo "Branch Protection Rule added:"
            echo "- \`ARGSTU Protection Branch\` ✅"
            echo ""
            echo "🔐 Authentication method: GitHub App"
            echo ""
            echo "🎉 Initialization complete!"
            echo ""
            echo "📌 Notes:"
            echo "- Topics and branch protection rule applied automatically via workflow"
          } >> $GITHUB_STEP_SUMMARY
