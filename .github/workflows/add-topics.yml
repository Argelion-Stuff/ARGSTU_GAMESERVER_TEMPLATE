name: Add Game Server Topics

on:
  push:
    branches:
      - main

jobs:
  add-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ➤ Generate GitHub App Installation Token
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Add repository topics
        id: add_topics
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          echo "Adding topics: server, game"
          gh repo edit "$GITHUB_REPOSITORY" --add-topic server --add-topic game

      - name: Summary Report
        run: |
          {
            echo "### 🏷️ Topics Added Successfully"
            echo ""
            echo "**Repository:** \`$GITHUB_REPOSITORY\`"
            echo ""
            echo "The following topics were added to this repository:"
            echo "- \`server\`"
            echo "- \`game\`"
            echo ""
            echo "🎉 Initialization complete!"
          } >> $GITHUB_STEP_SUMMARY
