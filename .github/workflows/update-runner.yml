# Workflow para ejecutar Ansible en un runner self-hosted identificado por la etiqueta pasada como input.
name: Run Ansible from ZimaBoard

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Etiqueta del runner self-hosted a usar (ejemplo: zimaboard)'
        required: true
        default: 'zimaboard'

jobs:
  run-playbook:
    runs-on: ${{ github.event.inputs.runner_label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workspace and list files for debugging
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Current dir: $(pwd)"
          echo "Top-level files:"
          ls -la
          echo "Recursive (limit 3 levels):"
          find . -maxdepth 3 -mindepth 1 -print

      - name: Show inventory file (if exists) and validate with ansible-inventory
        run: |
          INV_PATH="${GITHUB_WORKSPACE}/ansible_quickstart/inventories/hosts.yaml"
          echo "Checking inventory at: $INV_PATH"
          if [ -f "$INV_PATH" ]; then
            echo "Inventory file found. Head of file:"
            sed -n '1,200p' "$INV_PATH"
            echo "ansible-inventory --list output:"
            ansible-inventory -i "$INV_PATH" --list || true
          else
            echo "Inventory file NOT FOUND at $INV_PATH"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create Vault password file (from secret)
        run: |
          echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: Run ansible ping (test connectivity)
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          INV_PATH="${GITHUB_WORKSPACE}/ansible_quickstart/inventories/hosts.yaml"
          ansible all \
            -i "$INV_PATH" \
            -m ping \
            --vault-password-file .vault_pass \
            --extra-vars "ansible_user=argelion14"

      - name: Run ansible playbook (update)
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          INV_PATH="${GITHUB_WORKSPACE}/ansible_quickstart/inventories/hosts.yaml"
          ansible-playbook \
            -i "$INV_PATH" \
            ansible_quickstart/playbooks/update.yaml \
            --vault-password-file .vault_pass \
            --extra-vars "ansible_user=argelion14"

      - name: Cleanup vault password file
        if: always()
        run: |
          rm -f .vault_pass