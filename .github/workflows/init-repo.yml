name: Initialize Game Server Repository
run-name: "Initialize Game Server Repository - ${{ github.repository }}"

on:
  push:
    branches:
      - main

jobs:
  add-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 Generate GitHub App Installation Token
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure GH CLI
        run: |
          echo "${{ steps.app_token.outputs.token }}" | gh auth login --with-token

      - name: Add repository topics
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          echo "Adding topics: server, game"
          # Obtener topics actuales
          CURRENT_TOPICS=$(gh api /repos/$REPO/topics --jq '.names')
          # Combinar con nuevos topics
          JSON_PAYLOAD=$(jq -n --argjson cur "$CURRENT_TOPICS" '{"names": ($cur + ["server","game"] | unique)}')
          # Actualizar topics
          echo "$JSON_PAYLOAD" | gh api -X PUT -H "Accept: application/vnd.github+json" /repos/$REPO/topics --input -

      - name: Summary Report
        run: |
          {
            echo "### 🏷️ Repository Topics Summary"
            echo ""
            echo "**Repository:** \`$GITHUB_REPOSITORY\`"
            echo "- Topics added: \`server\`, \`game\`"
            echo "🔐 Authentication: GitHub App"
            echo "🎉 Topics initialization complete!"
          } >> $GITHUB_STEP_SUMMARY

  branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure GH CLI
        run: |
          echo "${{ steps.app_token.outputs.token }}" | gh auth login --with-token

      - name: Add Branch Protection Rule
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          RULESET_NAME="ARGSTU Protection Branch"
          echo "Adding branch protection rule: $RULESET_NAME"

          # Comprobar si el ruleset ya existe
          if gh api -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" /repos/$REPO/rulesets \
            --jq ".rulesets[] | select(.name==\"$RULESET_NAME\")" >/dev/null; then
            echo "✅ Branch protection rule '$RULESET_NAME' already exists, skipping creation."
          else
            cat <<EOF | gh api -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            /repos/$REPO/rulesets \
            --input -
            {
              "name": "$RULESET_NAME",
              "target": "branch",
              "source_type": "Repository",
              "source": "Argelion-Stuff/.github",
              "enforcement": "active",
              "conditions": {
                "ref_name": {
                  "include": ["~DEFAULT_BRANCH"],
                  "exclude": []
                }
              },
              "rules": [
                { "type": "deletion" },
                { "type": "non_fast_forward" },
                { "type": "creation" },
                {
                  "type": "pull_request",
                  "parameters": {
                    "required_approving_review_count": 1,
                    "dismiss_stale_reviews_on_push": true,
                    "required_reviewers": [],
                    "require_code_owner_review": true,
                    "require_last_push_approval": true,
                    "required_review_thread_resolution": true,
                    "automatic_copilot_code_review_enabled": true,
                    "allowed_merge_methods": ["merge","squash","rebase"]
                  }
                }
              ],
              "bypass_actors": []
            }
          EOF
            echo "✅ Branch protection rule '$RULESET_NAME' added."
          fi

      - name: Summary Report
        run: |
          {
            echo "### 🛡️ Branch Protection Summary"
            echo ""
            echo "**Repository:** \`$GITHUB_REPOSITORY\`"
            echo "- Branch Protection Rule added: \`ARGSTU Protection Branch\`"
            echo "🔐 Authentication: GitHub App"
            echo "🎉 Branch protection setup complete!"
          } >> $GITHUB_STEP_SUMMARY
