name: Initialize Game Server Repository
run-name: "Initialize Game Server Repository - ${{ github.repository }}"

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      runner:
        description: "Runner donde ejecutar el workflow"
        required: true
        default: "ubuntu-latest"

jobs:
  add-topics:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 Generate GitHub App Installation Token
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # 🏷️ Add repository topics
      - name: Add repository topics
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        with:
          script: |
            const repo = process.env.GITHUB_REPOSITORY;
            const [owner, repoName] = repo.split("/");
            const newTopics = ["server", "game"];

            // Obtener topics actuales
            const { data: current } = await github.rest.repos.getAllTopics({
              owner,
              repo: repoName
            });

            // Combinar con los nuevos topics y eliminar duplicados
            const updatedTopics = [...new Set([...current.names, ...newTopics])];

            // Actualizar topics
            await github.rest.repos.replaceAllTopics({
              owner,
              repo: repoName,
              names: updatedTopics
            });

            console.log(`Topics updated for ${repo}: ${updatedTopics.join(", ")}`);

      - name: Summary Report
        run: |
          {
            echo "### 🏷️ Repository Topics Summary"
            echo ""
            echo "**Repository:** \`$GITHUB_REPOSITORY\`"
            echo "- Topics added: \`server\`, \`game\`"
            echo "🔐 Authentication: GitHub App"
            echo "🎉 Topics initialization complete!"
          } >> $GITHUB_STEP_SUMMARY

  branch-protection:
    name: Add Branch Protection Rule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 Generar token de la GitHub App
      - name: Generate GitHub App Installation Token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure GH CLI
        run: |
          echo "${{ steps.app_token.outputs.token }}" | gh auth login --with-token

      - name: Add Branch Protection Rule
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          RULESET_NAME="ARGSTU Protection Branch"
          echo "Adding branch protection rule: $RULESET_NAME"

          # Comprobar si el ruleset ya existe
          EXISTS=$(gh api -H "Authorization: token $TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          /repos/$REPO/rulesets \
                          --jq ".[] | select(.name==\"$RULESET_NAME\") | .name")

          if [ -n "$EXISTS" ]; then
            echo "✅ Branch protection rule '$RULESET_NAME' already exists, skipping creation."
          else
            cat <<EOF | gh api -X POST \
          -H "Authorization: token $TOKEN" \
          -H "Accept: application/vnd.github+json" \
          /repos/$REPO/rulesets \
          --input -
          {
            "name": "$RULESET_NAME",
            "target": "branch",
            "source_type": "Repository",
            "source": "Argelion-Stuff/.github",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["~DEFAULT_BRANCH"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "deletion" },
              { "type": "non_fast_forward" },
              { "type": "creation" },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 1,
                  "dismiss_stale_reviews_on_push": true,
                  "required_reviewers": [],
                  "require_code_owner_review": true,
                  "require_last_push_approval": true,
                  "required_review_thread_resolution": true,
                  "automatic_copilot_code_review_enabled": true,
                  "allowed_merge_methods": ["merge","squash","rebase"]
                }
              }
            ],
            "bypass_actors": []
          }
          EOF
            echo "✅ Branch protection rule '$RULESET_NAME' added."
          fi

      - name: Summary Report
        run: |
          {
            echo "### 🛡️ Branch Protection Summary"
            echo ""
            echo "**Repository:** \`$GITHUB_REPOSITORY\`"
            echo "- Branch Protection Rule: \`ARGSTU Protection Branch\`"
            echo "🔐 Authentication: GitHub App"
            echo "🎉 Branch protection setup complete!"
          } >> $GITHUB_STEP_SUMMARY
